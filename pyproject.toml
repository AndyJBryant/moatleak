[project]
name = "moatleak"
version = "0.1.1"
description = "Local, offline scanner that maps which companies and countries processed your AI prompts."
readme = "README.md"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
keywords = ["ai", "privacy", "llm", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://moatleak.ai/"
Source = "https://github.com/AndyJBryant/moatleak"
Issues = "https://github.com/AndyJBryant/moatleak/issues"

[project.scripts]
moatleak = "moatleak.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.package-data]
moatleak = ["report/*.html", "data/*.toml", "data/providers/*.toml", "report/assets/*.png"]
